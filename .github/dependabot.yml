version: 2
updates:
  # 保持 workflow 里的 uses 为最新主版本；actions 彼此独立，合并成单个 PR 便于回滚
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # 项目由 Bun 管理（bun.lock），Dependabot 的 npm 生态无法更新它
  - package-ecosystem: bun
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
