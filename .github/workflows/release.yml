name: Release

# 两种触发：push tag，或在 Actions 页面的 ref 下拉框里选一个已有 tag 后手动触发。
# 不提供自由文本输入——运行的目标永远是触发时的那个 ref，避免「输入与 ref 不一致」。
# prepare 建 draft → build 并行打包上传 → publish 补校验和并转正。
# 三阶段是为了让三个平台共用一个 draft，避免并发覆盖自动生成的 release notes。
on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Verify & draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要历史来定位上一个 tag，生成增量 notes
          fetch-depth: 0

      - id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 允许带或不带 v 前缀（v1.2.3 / 1.2.3），release 名称与 git tag 保持一致。
          # 从分支触发会在这里被拒：请改用 tag 触发或在 ref 下拉框选择已有 tag。
          tag="$REF_NAME"
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::非法 tag：$tag，期望形如 v1.2.3 或 1.2.3"; exit 1; }
          version="${tag#v}"

          # 安装包版本取自 tauri.conf.json，三处须与 tag 一致（预发布带同样后缀）
          for f in src-tauri/tauri.conf.json package.json; do
            got=$(jq -r .version "$f")
            [[ "$got" == "$version" ]] || { echo "::error file=$f::版本 $got ≠ $version"; exit 1; }
          done
          got=$(awk '/^\[package\]/{f=1;next}/^\[/{f=0}f&&/^version[[:space:]]*=/{gsub(/[",]/,"");print $3;exit}' src-tauri/Cargo.toml)
          [[ "$got" == "$version" ]] || { echo "::error file=src-tauri/Cargo.toml::版本 $got ≠ $version"; exit 1; }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            version="${TAG#v}"
            prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            args=(--draft --title "$TAG" --generate-notes)
            [[ -n "$prev" ]] && args+=(--notes-start-tag "$prev")
            [[ "$version" == *-* ]] && args+=(--prerelease)

            gh release create "$TAG" "${args[@]}"
          fi

          # --generate-notes 与 --notes-file 互斥，故先建后追加安装说明
          cat > /tmp/notes.md <<'EOF'

          ---

          ### 安装

          | 平台 | 安装包 |
          | --- | --- |
          | macOS（仅 Apple Silicon，M1+） | `.dmg` |
          | Windows | `.msi` / `.exe` |
          | Linux | `.AppImage` / `.deb` / `.rpm` |

          - macOS 未签名版本首次打开：`xattr -dr com.apple.quarantine /Applications/starter.app`
          - Linux AppImage：需 `libfuse2`，并 `chmod +x`
          - 完整性校验：`sha256sum -c SHA256SUMS.txt`
          EOF

          # 幂等：重跑时正文里已有「### 安装」就不再重复追加
          body=$(gh release view "$TAG" --json body -q .body)
          if [[ "$body" == *"### 安装"* ]]; then
            echo "安装说明已存在，跳过"
            exit 0
          fi

          { printf '%s\n' "$body"; cat /tmp/notes.md; } > /tmp/full.md
          gh release edit "$TAG" --notes-file /tmp/full.md

  build:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 已是 arm64，显式声明 target 让缓存与产物命名稳定
          - {
              label: macOS (Apple Silicon),
              platform: macos-latest,
              args: "--target aarch64-apple-darwin",
              targets: aarch64-apple-darwin,
            }
          # 22.04 而非 24.04：glibc 2.35 兼容面更广
          - { label: Linux (x86_64), platform: ubuntu-22.04, args: "", targets: "" }
          - { label: Windows (x86_64), platform: windows-latest, args: "", targets: "" }
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.targets }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libfuse2 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      # beforeBuildCommand 内含 tsc，类型错误会在此失败
      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 留空即跳过签名与公证
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # 不传 releaseName/releaseBody，否则覆盖自动生成的 notes
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checksums & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$TAG" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false

          {
            echo "### 已发布 $TAG"
            echo '```'
            gh release view "$TAG" --json assets -q '.assets[] | "\(.name)\t\(.size) bytes"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
